#
# qmake configuration for hard-float Zynq (arm-linux-gnueabihf, GCC 11)
# Link against /opt/zynq-sysroot libc, libstdc++ and libgcc_s, not the
# Ubuntu cross libc (glibc 2.43) or its libstdc++.so.6.0.35.
#

MAKEFILE_GENERATOR      = UNIX
CONFIG                 += incremental
QMAKE_INCREMENTAL_STYLE = sublib

include(../common/linux.conf)
include(../common/gcc-base-unix.conf)
include(../common/g++-unix.conf)

QMAKE_CC                = arm-linux-gnueabihf-gcc
QMAKE_CXX               = arm-linux-gnueabihf-g++
QMAKE_LINK              = arm-linux-gnueabihf-g++
QMAKE_LINK_SHLIB        = arm-linux-gnueabihf-g++

QMAKE_AR                = arm-linux-gnueabihf-ar cqs
QMAKE_OBJCOPY           = arm-linux-gnueabihf-objcopy
QMAKE_NM                = arm-linux-gnueabihf-nm -P
QMAKE_STRIP             = arm-linux-gnueabihf-strip

# Hard float. The soft-float default lives in linux-arm-gnueabi-g++.
QMAKE_CFLAGS           += -march=armv7-a -mfpu=neon -mfloat-abi=hard -mthumb
QMAKE_CXXFLAGS         += -march=armv7-a -mfpu=neon -mfloat-abi=hard -mthumb

# Board glibc is 2.30. GCC 11's default PIE startup needs GLIBC_2.34.
QMAKE_CFLAGS           += -fno-pie -U_TIME_BITS -U_FILE_OFFSET_BITS -D_FILE_OFFSET_BITS=64
QMAKE_CXXFLAGS         += -fno-pie -U_TIME_BITS -U_FILE_OFFSET_BITS -D_FILE_OFFSET_BITS=64
QMAKE_LFLAGS           += -no-pie -Wl,-rpath-link,/opt/zynq-sysroot/lib:/opt/zynq-sysroot/usr/lib
QMAKE_LFLAGS_SHLIB     += -Wl,-rpath-link,/opt/zynq-sysroot/lib:/opt/zynq-sysroot/usr/lib
QMAKE_LFLAGS_PLUGIN    += -Wl,-rpath-link,/opt/zynq-sysroot/lib:/opt/zynq-sysroot/usr/lib
QMAKE_LFLAGS_APP       += -no-pie

# Prefer the sysroot copies over the Ubuntu multiarch libraries.
QMAKE_LIBDIR           += /opt/zynq-sysroot/usr/lib /opt/zynq-sysroot/lib
# glibc 2.33 renamed __xstat64 to stat64. The board libc is 2.30.
QMAKE_LIBS             += -Wl,--allow-multiple-definition -Wl,--whole-archive -lglibc-compat -Wl,--no-whole-archive

load(qt_config)
